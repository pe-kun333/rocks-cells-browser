<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- build.ps1 が、exe の横にコピーした UI が古くないかをこの印で確かめる -->
    <meta name="honeycomb-ui" content="themes-boot" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' https: http: data:; style-src 'self' 'unsafe-inline'; connect-src 'self' https://api.anthropic.com"
    />
    <!-- 見た目のテーマを、CSS より先に <html> へ付ける（最初の一瞬の色。CSP でインラインは動かないのでファイル） -->
    <script src="/theme-boot.js"></script>
    <title>Rocks-cells Browser Ver0.031β-en</title>
  </head>
  <body>
    <header class="toolbar">
      <button id="back" title="戻る" aria-label="戻る">←</button>
      <button id="forward" title="進む" aria-label="進む">→</button>
      <button id="reload" title="再読み込み" aria-label="再読み込み">↻</button>
      <form id="address-form" class="address-form">
        <input id="address" type="text" spellcheck="false" autocomplete="off" placeholder="検索または URL を入力" />
      </form>
    </header>
    <nav class="viewbar">
      <div class="seg" role="group" aria-label="表示の大きさ">
        <button id="mode-small" aria-pressed="true" title="小さい表示（ハニカム）">小</button>
        <button id="mode-large" aria-pressed="false" title="大きい表示（リスト）">大</button>
      </div>
      <div class="seg" role="group" aria-label="大きい表示の形">
        <button id="shape-regular" aria-pressed="true" title="正六角形" aria-label="正六角形">
          <svg viewBox="0 0 16 16" aria-hidden="true"><polygon points="8,1.5 13.6,4.75 13.6,11.25 8,14.5 2.4,11.25 2.4,4.75" /></svg>
        </button>
        <button id="shape-wide" aria-pressed="false" title="横長" aria-label="横長">
          <svg viewBox="0 0 16 16" aria-hidden="true"><polygon points="1,8 4,3.5 12,3.5 15,8 12,12.5 4,12.5" /></svg>
        </button>
      </div>
      <span class="spacer"></span>
      <button id="toggle-numbers" aria-pressed="false" title="番号を表示" aria-label="番号を表示">#</button>
      <button id="toggle-route" aria-pressed="true" title="順路を表示（リンクをたどった道を、タブどうしの線と番号で）" aria-label="順路を表示">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="3.5" cy="4" r="2" /><circle cx="12.5" cy="4" r="2" /><circle cx="8" cy="12.5" r="2" /><polyline points="5.5,4 10.5,4" /><polyline points="4.5,5.8 7,10.7" stroke-dasharray="1.6 1.4" /></svg>
      </button>
      <button id="open-reader" title="六角で読む（ページの本文を六角セルに組み直す）" aria-label="六角で読む">
        <svg viewBox="0 0 16 16" aria-hidden="true"><polygon points="8,1.5 13.6,4.75 13.6,11.25 8,14.5 2.4,11.25 2.4,4.75" /><line x1="5" y1="6.5" x2="11" y2="6.5" /><line x1="5" y1="9.5" x2="10" y2="9.5" /></svg>
      </button>
      <button id="popout" class="popout-button" hidden title="小窓にする（最前面）。YouTube や音声を前に置いたまま、ほかのタブを読めます">小窓</button>
      <button id="daily" class="daily-button" title="今日のふりかえり。順路・ハート・メモ・単語帳からノートを1枚作ります（ページの本文は送りません）。ハートのタブには、休眠したあとでも読める一行を残します" aria-label="今日のふりかえり">今日</button>
      <div class="menu-wrap">
        <button id="theme-button" title="見た目（テーマ）" aria-label="見た目" aria-haspopup="menu" aria-expanded="false">
          <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.5" /><path class="icon-fill" d="M8 2.5a5.5 5.5 0 0 1 0 11z" /></svg>
        </button>
        <div id="theme-menu" class="menu theme-menu" role="menu" aria-label="見た目" hidden>
          <div class="theme-menu-head"><b>見た目</b><span class="theme-now"></span></div>
          <button role="menuitemradio" data-theme-mode="auto">自動（Windows の明暗に合わせる）</button>
          <button role="menuitemradio" data-theme-mode="fixed">いつも同じテーマ</button>
          <div class="theme-row" data-row="light" role="group"></div>
          <div class="theme-row" data-row="dark" role="group"></div>
          <p class="theme-slots"></p>
          <div class="menu-sep" role="separator"></div>
          <button role="menuitemcheckbox" data-theme-pages aria-checked="true">ページの明暗もテーマに合わせる</button>
          <button role="menuitem" data-theme-reset>既定に戻す</button>
          <div class="menu-sep" role="separator"></div>
          <div class="theme-menu-head"><b>言語 / Language</b></div>
          <button role="menuitemradio" data-lang="auto">自動（Windows の言語に合わせる）</button>
          <button role="menuitemradio" data-lang="ja">日本語</button>
          <button role="menuitemradio" data-lang="en">English</button>
          <p class="theme-slots lang-note"></p>
        </div>
      </div>
      <div class="menu-wrap">
        <button id="preview-button" title="拡大表示の場所" aria-label="拡大表示の場所" aria-haspopup="menu">
          <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5" /><line x1="10.4" y1="10.4" x2="14" y2="14" /></svg>
        </button>
        <div id="preview-menu" class="menu" role="menu" hidden>
          <button role="menuitemradio" data-placement="dock">下に固定</button>
          <button role="menuitemradio" data-placement="float">自由に配置</button>
          <button role="menuitemradio" data-placement="popup">ポップアップ</button>
          <button role="menuitemradio" data-placement="right">右サイドバー</button>
          <button role="menuitemradio" data-placement="off">表示しない</button>
          <div class="menu-sep" role="separator"></div>
          <button id="toggle-popup-detail" role="menuitemcheckbox" aria-checked="true" title="ポップアップを押して固定したときだけ、右のカードと同じボタン（♡・相棒に見せる・消す・タグ など）を出します。マウスを乗せただけのときは小さいままです">固定したポップアップは詳しく</button>
        </div>
      </div>
      <button id="toggle-right" aria-pressed="false" title="右サイドバー" aria-label="右サイドバー">
        <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5" /><line x1="10.5" y1="2.5" x2="10.5" y2="13.5" /></svg>
      </button>
      <button id="new-tab" title="新しいタブ (Ctrl+T)" aria-label="新しいタブ">＋</button>
    </nav>
    <main id="board" class="board-wrap"></main>
    <aside id="dock" class="dock" hidden></aside>
    <section id="panels" class="panels"></section>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
